# 注意：本项目的测试方法名全是中文，编译产物里会出现带中文的 class 文件名
# （方法里有 lambda 时 Kotlin 生成 `XxxTest$中文方法名$1.class`）。能不能写出
# 这种文件名取决于 JVM 的 sun.jnu.encoding —— 它管**文件名**，与管内容的
# file.encoding 是两回事，而且**不能**用 -D 设置：JVM 在读系统属性之前就已经从
# 操作系统 locale 推断好了。所以下面只设 file.encoding，别再往里加 sun.jnu.encoding，
# 加了也不生效（试过）。
#
# 正确做法是让 shell 带上 UTF-8 locale 再调 gradle：
#     LANG=C.UTF-8 ./gradlew :core:test
# Gradle 守护进程继承客户端的环境变量，这样就够了。CI 的 runner 自带 UTF-8 locale，
# 不受影响。locale 不对时 :core 的构建会直接报错说明，见 core/build.gradle.kts。
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
kotlin.code.style=official

# ── :android 相关 ────────────────────────────────────────────
# 依赖全部是 AndroidX（Compose、WorkManager、core-ktx），不开这个开关
# AGP 会在解析依赖图之后直接报 AndroidXDependencyCheck 失败。
# 这两个属性在 :android 没被包含时是惰性的，不影响纯 :core 的构建。
android.useAndroidX=true
# 不做 support-library 到 AndroidX 的字节码改写：本项目没有任何旧 support 依赖，
# 开着只会平白拖慢构建。
android.enableJetifier=false
